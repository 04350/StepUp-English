name: Build StepUp English desktop app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read canonical version
        run: |
          node .github/scripts/set-version.cjs >> "$env:GITHUB_ENV"
          $version = node -p "require('./version.json').version"
          "STEPUP_VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        shell: pwsh
        id: version

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Validate version metadata and release configuration
        run: node tests/validate-release.cjs

      - name: Set up Python for icon preparation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare branded Windows icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/prepare-icons.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: desktop/go.mod

      - name: Embed the current versioned offline learning app
        shell: pwsh
        run: node .github/scripts/inject-version.cjs index.html desktop/app.html

      - name: Test Windows local-origin persistence
        working-directory: desktop
        shell: pwsh
        run: go test ./...

      - name: Build native Windows app
        working-directory: desktop
        shell: pwsh
        run: |
          go mod tidy
          go mod download
          go run github.com/akavel/rsrc@latest -ico StepUp-English.ico -o rsrc_windows_amd64.syso -arch amd64
          if (!(Test-Path "rsrc_windows_amd64.syso")) { throw "Windows icon resource was not generated" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "dist/StepUp-English-Windows-v$env:STEPUP_VERSION.exe" .
          $exe = Get-Item "dist/StepUp-English-Windows-v$env:STEPUP_VERSION.exe"
          if ($exe.Length -lt 1000000) { throw "EXE is unexpectedly small; the embedded app may be missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Output is not a Windows PE executable" }
          Write-Host "Built $($exe.Length)-byte Windows executable"

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $appPath = (Resolve-Path "desktop/dist/StepUp-English-Windows-v$env:STEPUP_VERSION.exe").Path
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "StepUp English closed during startup (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-English-Windows-x64
          path: desktop/dist/StepUp-English-Windows-v*.exe
          if-no-files-found: error
          retention-days: 30
