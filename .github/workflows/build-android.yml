name: Build StepUp English Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for content checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the current offline learning app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
          test "$(wc -c < android/app/src/main/assets/index.html)" -gt 1000000

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and embedded offline content
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          source = Path("../index.html").read_bytes()
          assert apk.is_file() and apk.stat().st_size > 1_000_000, "APK missing or unexpectedly small"
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, "APK ZIP integrity check failed"
              bundled = archive.read("assets/index.html")
              assert bundled == source, "APK does not contain the current index.html"
          print(f"APK verified: {apk.stat().st_size:,} bytes; embedded HTML: {len(source):,} bytes")
          PY
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root was not found"; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner was not found in Android build-tools"; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare a clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/StepUp-English-v1.4.1.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-English-Android
          path: android/app/build/outputs/apk/debug/StepUp-English-v1.4.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: StepUp English Android v1.4.1
          body: |
            StepUp English Android app.
            Offline lessons and bundled offline MP3 pronunciation fallback for all 284 dictionary entries.
            Signed APK for manual installation. Android 6.0 (API 23) or newer.
          files: android/app/build/outputs/apk/debug/StepUp-English-v1.4.1.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            adb wait-for-device
            BOOTED=0
            for attempt in $(seq 1 120); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
                BOOTED=1
                break
              fi
              sleep 2
            done
            test "$BOOTED" = "1"
            PACKAGE_READY=0
            for attempt in $(seq 1 60); do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                PACKAGE_READY=1
                break
              fi
              sleep 2
            done
            test "$PACKAGE_READY" = "1"
            adb logcat -c
            adb install -r --no-streaming "$APK"
            adb shell am force-stop com.stepupenglish.app
            adb shell am start -n com.stepupenglish.app/.MainActivity
            sleep 10
            adb shell pidof com.stepupenglish.app
            adb shell dumpsys activity activities | grep -q "com.stepupenglish.app/.MainActivity"
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
