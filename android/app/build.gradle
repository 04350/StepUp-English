import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def versionFile = rootProject.file("../version.json")
if (!versionFile.exists()) {
    throw new GradleException("Missing root version.json")
}
def versionConfig = new JsonSlurper().parse(versionFile)
def releaseSigningPath = System.getenv("STEPUP_KEYSTORE_PATH")

android {
    namespace "com.stepupenglish.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.stepupenglish.app"
        minSdk 23
        targetSdk 34
        versionCode versionConfig.androidVersionCode as int
        versionName versionConfig.version as String
    }

    if (releaseSigningPath) {
        signingConfigs {
            release {
                storeFile file(releaseSigningPath)
                storePassword System.getenv("STEPUP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("STEPUP_KEY_ALIAS")
                keyPassword System.getenv("STEPUP_KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseSigningPath ? signingConfigs.release : signingConfigs.debug
        }
    }
}
